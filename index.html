<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15班班级蹭饭地图</title>
<style>
  :root{
    --paper:#FBF7F0;
    --ink:#4A3F33;
    --ink-soft:#7A6C5C;
    --accent:#9E2B20;
    --accent-2:#C94532;
    --line:#EADFCC;
    --card:#FFFFFF;
    --chip:#F3ECDF;
    --banner-1:#B03A2E;
    --banner-2:#8F2318;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100vh; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }

  /* ---------- 顶部：徽章 + 标题 ---------- */
  header{
    background:linear-gradient(180deg,#FFFFFF 0%,#FDFAF3 100%);
    border-bottom:2px solid var(--line);
    padding:18px 28px 14px;
    display:flex; align-items:center; justify-content:center; gap:28px;
    flex-wrap:wrap;
  }
  .badge{ width:92px; height:92px; object-fit:contain; border-radius:14px;
    box-shadow:0 3px 12px rgba(158,43,32,.18); background:#fff; padding:4px; }
  .title-wrap{ text-align:center; }
  .title-wrap h1{
    font-family:"STKaiti","KaiTi","华文楷体","Songti SC",serif;
    font-size:44px; letter-spacing:10px; color:var(--accent);
    text-shadow:0 2px 0 #F3D9D0;
    white-space:nowrap;
  }
  .subtitle{ margin-top:6px; font-size:15px; color:var(--ink-soft); letter-spacing:4px; }

  /* ---------- 教师信息条 ---------- */
  .teachers{
    background:linear-gradient(90deg,var(--banner-1),var(--banner-2));
    color:#FFF8F2;
    text-align:center;
    padding:10px 16px;
    font-size:15px;
    letter-spacing:2px;
    border-bottom:2px solid var(--line);
    display:flex; flex-wrap:wrap; justify-content:center; gap:6px 26px;
  }
  .teachers b{ font-weight:600; color:#FFE3C4; }

  /* ---------- 统计条 ---------- */
  .stats{
    display:flex; justify-content:center; gap:44px;
    padding:12px 16px 0;
    font-size:14px; color:var(--ink-soft);
  }
  .stats .num{ font-family:Georgia,serif; font-size:24px; color:var(--accent); font-weight:700; margin-right:5px; }

  /* ---------- 主体：地图 + 名单 ---------- */
  main{
    flex:1; display:flex; gap:18px;
    padding:14px 24px 20px;
    min-height:0;
  }
  #map-box{
    flex:1; min-width:0; position:relative;
    background:var(--card);
    border:2px solid var(--line); border-radius:16px;
    box-shadow:0 4px 18px rgba(158,43,32,.08);
   overflow:hidden; /* 兜底：任何情况下提示框等浮层不得撑出横向滚动 */
    touch-action:none;
    -webkit-user-select:none;
    user-select:none;
  }
  #map{ width:100%; height:100%; min-height:520px; border-radius:16px; }
  /* 地图手势完全交给 ECharts：禁止浏览器抢走双指缩放/页面缩放，避免与地图缩放叠加导致大小跳动、散点脱离地图 */
  #map{ touch-action:none; will-change:transform; }
  #map canvas, #map svg{ touch-action:none; }

  /* 地图图例 */
  .legend{
    position:absolute; left:14px; bottom:14px; z-index:10;
    background:rgba(255,255,255,.94); border:1px solid var(--line);
    border-radius:10px; padding:8px 12px;
    font-size:12px; color:var(--ink-soft);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
  }
  .legend .item{ display:flex; align-items:center; gap:5px; }
  .legend .dot{ border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px #D8CBB2; }

  /* 地图提示条（放大后显示城市标注） */
  .map-tip{
    position:absolute; left:14px; top:14px; z-index:10;
    background:rgba(255,255,255,.92); border:1px solid var(--line);
    border-radius:999px; padding:5px 12px;
    font-size:12px; color:var(--ink-soft);
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    pointer-events:none;
    transition:opacity .35s ease, transform .35s ease;
  }
  .map-tip.hide{ opacity:0; transform:translateY(-8px); }

  /* 查看全屏地图按钮 */
  .fullscreen-btn{
    position:absolute; top:12px; right:12px; z-index:30;
    display:inline-flex; align-items:center;
    padding:7px 13px;
    background:rgba(255,255,255,.94); border:1px solid var(--line);
    border-radius:999px;
    color:var(--accent); font-size:13px; font-weight:600;
    box-shadow:0 2px 10px rgba(0,0,0,.10);
    cursor:pointer;
    transition:background .15s ease, transform .15s ease, box-shadow .15s ease;
  }
  .fullscreen-btn:hover{
    background:#fff; transform:translateY(-1px);
    box-shadow:0 4px 14px rgba(0,0,0,.14);
  }

  /* ---------- DOM 红点覆盖层 ---------- */
  /* 红点不用 ECharts scatter（独立画布/SVG 层在手势中与 geo 可能失步导致错位），
     改为 DOM 元素，georoam 后用 convertToPixel 直接计算像素坐标定位，从根本上保证同步 */
  #dot-overlay{
    position:absolute; inset:0; z-index:6; pointer-events:none;
  }
  #dot-overlay.dragging .city-dot{ pointer-events:none; } /* 手机拖拽时红点不拦截手势 */
  .city-dot{
    position:absolute; left:0; top:0; transform:translate3d(-50%,-50%,0);
    pointer-events:auto; cursor:pointer; will-change:transform;
  }
  .city-dot .dot-circle{
    border-radius:50%; border:2px solid #fff;
    box-shadow:0 0 0 1px rgba(160,60,40,.25),0 2px 8px rgba(160,60,40,.35);
    transition:transform .15s ease;
  }
  .city-dot:hover .dot-circle, .city-dot.active .dot-circle{ transform:scale(1.3); }
  .city-dot .dot-label{
    position:absolute; top:100%; left:50%; transform:translateX(-50%);
    margin-top:5px; white-space:nowrap; font-size:12px; font-weight:600;
    color:#6B5A48;
    text-shadow:0 0 4px rgba(255,255,255,.95),0 0 2px rgba(255,255,255,.95);
    pointer-events:none; opacity:0; transition:opacity .25s ease;
  }
  .city-dot.show-label .dot-label{ opacity:1; }

  #custom-tooltip{
    position:absolute; z-index:20;
    background:rgba(255,252,246,.97); border:1px solid #E2D5BC; border-radius:10px;
    padding:10px 14px; box-shadow:0 4px 16px rgba(0,0,0,.12);
    max-width:240px; max-height:260px; overflow-y:auto; display:none;
  }

  /* ---------- 右侧名单 ---------- */
  #list{
    width:400px; flex-shrink:0;
    overflow-y:auto;
    background:var(--card);
    border:2px solid var(--line); border-radius:16px;
    padding:14px 16px 20px;
    box-shadow:0 4px 18px rgba(158,43,32,.08);
  }
  #list::-webkit-scrollbar{ width:8px; }
  #list::-webkit-scrollbar-thumb{ background:#E2D5BC; border-radius:4px; }
  #list h2{ font-size:16px; letter-spacing:2px; color:var(--accent); margin-bottom:2px; }
  #list .hint{ font-size:12px; color:var(--ink-soft); margin-bottom:12px; }

  .city{ margin-bottom:14px; scroll-margin-top:10px; }
  .city.flash{ animation:flash 1.4s ease; border-radius:12px; }
  @keyframes flash{
    0%{ background:#F9E3DC; } 40%{ background:#F6D3C8; } 100%{ background:transparent; }
  }
  .city-head{
    display:flex; align-items:center; gap:10px;
    cursor:pointer; user-select:none;
    padding:6px 10px; margin-bottom:6px;
    background:linear-gradient(90deg,#F7EAE3,#FBF3EC);
    border-left:4px solid var(--accent-2);
    border-radius:8px;
    transition:transform .12s ease;
  }
  .city-head:hover{ transform:translateX(3px); }
  .city-name{ font-size:16px; font-weight:700; color:var(--accent); letter-spacing:2px; }
  .city-count{ font-size:12px; color:#fff; background:var(--accent-2); border-radius:999px; padding:1px 9px; }
  .city-province{ font-size:12px; color:#B9AC96; margin:0 2px 0 6px; }
  /* 缩放/拖拽时禁用圆点和标签的过渡动画，减少移动端卡顿 */
  #dot-overlay.zooming .city-dot .dot-circle,
  #dot-overlay.zooming .city-dot .dot-label{ transition:none !important; }

  .schools{ padding-left:10px; }
  .school{ display:flex; align-items:baseline; gap:8px; padding:4px 0; }
  .school-name{ font-size:14px; font-weight:600; color:var(--ink); white-space:nowrap; }
  .students{ font-size:13px; color:var(--ink-soft); }

  footer{ text-align:center; font-size:12px; color:#B9AC96; padding:0 0 12px; letter-spacing:2px; }

  /* ---------- 全屏地图预览层 ---------- */
  .map-fullscreen{
    position:fixed; inset:0; z-index:1000;
    display:flex; align-items:center; justify-content:center;
    padding:18px;
    background:rgba(22,15,10,.96);
  }
  .map-fullscreen[hidden]{ display:none; }
  .map-fullscreen img{
    max-width:100%; max-height:100%;
    object-fit:contain;
    border-radius:6px;
    box-shadow:0 8px 40px rgba(0,0,0,.45);
    -webkit-user-select:none;
    user-select:none;
  }
  .map-fullscreen-close{
    position:absolute; z-index:1;
    top:max(16px, env(safe-area-inset-top));
    right:max(16px, env(safe-area-inset-right));
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(255,255,255,.35);
    background:rgba(0,0,0,.35); color:#fff;
    font-size:28px; line-height:1; cursor:pointer;
    box-shadow:0 2px 12px rgba(0,0,0,.25);
  }
  .map-fullscreen-close:hover{ background:rgba(0,0,0,.55); }

  @media (max-width:960px){
    main{ flex-direction:column; }
    /* 纵向布局下 #map-box 若仍参与 flex 伸缩，会被不可收缩的名单挤成矮盒（实测可塌到 15px），
       overflow:hidden 把地图底部/整体裁掉，红点随之消失或"错位"。改为按内容自适应高度。 */
    #map-box{ flex:none; }
    #map{ min-height:420px; }
    #list{ width:100%; max-height:420px; }
    .title-wrap h1{ font-size:30px; letter-spacing:6px; }
    .badge{ width:64px; height:64px; }
  }

  /* ---------- 手机端优化 ---------- */
  @media (max-width:720px){
    html,body{ height:auto; min-height:100dvh; }
    header{ padding:10px 10px 8px; gap:8px; flex-wrap:nowrap; }
    .badge{ width:44px; height:44px; border-radius:10px; }
    .title-wrap h1{ font-size:21px; letter-spacing:3px; }
    .subtitle{ font-size:12px; letter-spacing:2px; margin-top:4px; }
    .teachers{ font-size:12px; letter-spacing:1px; padding:8px 10px; gap:4px 14px; }
    .stats{ gap:20px; font-size:12px; padding:10px 10px 0; }
    .stats .num{ font-size:20px; }
    main{ padding:10px 10px 16px; gap:12px; }
    #map{ height:52vh; min-height:300px; max-height:560px; }
    #list{ max-height:none; padding:12px 12px 16px; }
    .city-head{ padding:9px 10px; }
    .map-tip{
      left:8px; top:8px; font-size:11px; padding:4px 10px;
      max-width:calc(100% - 124px); line-height:1.35;
    }
    .fullscreen-btn{ top:8px; right:8px; padding:6px 10px; font-size:12px; }
    .legend{ left:8px; bottom:8px; font-size:11px; padding:6px 10px; gap:8px; }
    footer{ font-size:11px; letter-spacing:1px; margin-top:auto; padding-bottom:max(12px, env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<header>
  <img class="badge" src="绵阳中学校徽.jpg" alt="绵阳中学校徽">
  <div class="title-wrap">
    <h1>2023级15班班级蹭饭地图</h1>
    <div class="subtitle">毕业去向 · 到哪儿都能蹭到饭 🍚</div>
  </div>
  <img class="badge" src="15班班徽.png" alt="15班班徽">
</header>

<div class="teachers">
  <span>班主任：<b>文选</b></span>
  <span>语文：<b>李永贵</b></span>
  <span>数学：<b>何虎</b></span>
  <span>英语：<b>李佳翼</b></span>
  <span>物理：<b>邓彬</b></span>
  <span>化学：<b>文选</b></span>
  <span>生物：<b>林玲</b></span>
</div>

<div class="stats">
  <span><span class="num" id="st-people">0</span>名同学</span>
  <span><span class="num" id="st-school">0</span>所高校</span>
  <span><span class="num" id="st-city">0</span>座城市</span>
</div>

<main>
  <div id="map-box">
   <div id="map"></div>
   <div id="dot-overlay"></div>
   <div id="custom-tooltip"></div>
   <div class="legend">
      <span>人数</span>
      <span class="item"><span class="dot" style="width:12px;height:12px;background:#F0A99B"></span>1</span>
      <span class="item"><span class="dot" style="width:15px;height:15px;background:#DE6F5C"></span>2–3</span>
      <span class="item"><span class="dot" style="width:19px;height:19px;background:#C94532"></span>4–6</span>
      <span class="item"><span class="dot" style="width:24px;height:24px;background:#A83020"></span>7+</span>
    </div>
    <div class="map-tip" id="map-tip">🔍 拖动平移 · 滚动/双指缩放地图，放大后显示城市标注</div>
    <button type="button" class="fullscreen-btn" id="fullscreen-btn">查看全屏地图</button>
  </div>

  <aside id="list">
    <h2>去向名单</h2>
    <div class="hint">点击城市可在地图上定位 · 点击地图标记可跳回名单</div>
    <div id="city-list"></div>
  </aside>
</main>

<footer>四川省绵阳中学 · 高2023级15班 · 蹭饭地图 v1.3</footer>

<div class="map-fullscreen" id="map-fullscreen" hidden>
  <button type="button" class="map-fullscreen-close" id="map-fullscreen-close" aria-label="关闭全屏地图">×</button>
  <img src="蹭饭地图.png" alt="15班蹭饭地图全屏">
</div>

<script src="assets/echarts.min.js"></script>
<script src="assets/china-map.js"></script>
<script>
/* ================= 数据 ================= */
const CITIES = [
  { city:'北京', province:'北京市', coords:[116.41,39.90], schools:[
    ['清华大学',['万柯杏']],
    ['北京航空航天大学',['陈牧逸']],
    ['中国农业大学',['余承艾狄','吴振东']],
    ['中央民族大学',['陈鹏宇']],
    ['北京师范大学',['宋淇鹏']],
    ['华北电力大学',['丁钲轩']],
    ['中央财经大学',['白雨涵']],
    ['中国地质大学',['舒阳洋']],
    ['中国传媒大学',['王嘉唯']],
  ]},
  { city:'天津', province:'天津市', coords:[117.19,39.13], schools:[
    ['南开大学',['李俊宁','袁奥翔']],
    ['天津大学',['蒋思捷','刘思远']],
  ]},
  { city:'上海', province:'上海市', coords:[121.47,31.23], schools:[
    ['上海财经大学',['王月']],
    ['华东理工大学',['王博为']],
    ['华东师范大学',['刘子涵']],
  ]},
  { city:'重庆', province:'重庆市', coords:[106.55,29.56], schools:[
    ['重庆大学',['刘谨瑜','何永康']],
    ['联勤保障部队工程大学',['李泽盟']],
  ]},
  { city:'成都', province:'四川省', coords:[104.07,30.67], schools:[
    ['电子科技大学',['龚飞陶','胡馨月','王羿丹','赵允坚']],
    ['西南财经大学',['王浩宇','魏佳玲']],
    ['四川大学',['罗钰婷','夏竹雅']],
    ['西南交通大学',['陈以珊','胥逸凡']],
    ['西南石油大学',['李嘉帆','何骏铜']],
  ]},
  { city:'雅安', province:'四川省', coords:[103.04,30.01], schools:[
    ['四川农业大学',['黄逸','毛毓烨','黄子轩']],
  ]},
  { city:'南京', province:'江苏省', coords:[118.80,32.06], schools:[
    ['南京大学',['朱鑫燊']],
    ['南京航空航天大学',['鲁哲宇','叶晨希']],
    ['南京理工大学',['林曾诚']],
    ['河海大学',['彭琪茗']],
  ]},
  { city:'厦门', province:'福建省', coords:[118.09,24.48], schools:[
    ['厦门大学',['周幸芮仟','朱姊殷']],
  ]},
  { city:'哈尔滨', province:'黑龙江省', coords:[126.63,45.75], schools:[
    ['哈尔滨工业大学',['袁一备','刘佳鑫']],
  ]},
  { city:'秦皇岛', province:'河北省', coords:[119.60,39.93], schools:[
    ['东北大学（秦皇岛分校）',['雷晟杰','罗泽同']],
  ]},
  { city:'长春', province:'吉林省', group:1, coords:[125.32,43.82], schools:[
    ['吉林大学',['王润峰']],
  ]},
  { city:'吉林市', province:'吉林省', group:1, coords:[126.55,43.84], schools:[
    ['东北电力大学',['胡栗豪']],
  ]},
  { city:'大连', province:'辽宁省', coords:[121.62,38.91], schools:[
    ['大连海事大学',['赵晨皓']],
  ]},
  { city:'太原', province:'山西省', coords:[112.55,37.87], schools:[
    ['太原理工大学',['姚俊希']],
  ]},
  { city:'兰州', province:'甘肃省', coords:[103.83,36.06], schools:[
    ['兰州大学',['陈信']],
  ]},
  { city:'长沙', province:'湖南省', coords:[112.94,28.23], schools:[
    ['湖南大学',['梁梓铃']],
  ]},
  { city:'武汉', province:'湖北省', coords:[114.31,30.59], schools:[
    ['华中师范大学',['何佳金']],
  ]},
  { city:'杭州', province:'浙江省', coords:[120.16,30.29], schools:[
    ['浙江大学',['何嘉鑫']],
  ]},
  { city:'深圳', province:'广东省', coords:[114.06,22.55], schools:[
    ['深圳理工大学',['邓可']],
  ]},
];

CITIES.forEach(c => { c.count = c.schools.reduce((n,s)=>n+s[1].length,0); });
CITIES.sort((a,b)=> b.count - a.count || (b.group||0) - (a.group||0) || a.city.localeCompare(b.city,'zh'));
CITIES.forEach((c,i)=>{ c.idx = i; }); // 排序后重新编号，保证名单/地图索引一致

/* ================= 统计 ================= */
const totalPeople = CITIES.reduce((n,c)=>n+c.count,0);
const totalSchools = CITIES.reduce((n,c)=>n+c.schools.length,0);
document.getElementById('st-people').textContent = totalPeople;
document.getElementById('st-school').textContent = totalSchools;
document.getElementById('st-city').textContent = CITIES.length;

/* ================= 颜色 / 大小（人数→顺序色阶） ================= */
function ramp(n){
  if(n>=7) return '#A83020';
  if(n>=4) return '#C94532';
  if(n>=2) return '#DE6F5C';
  return '#F0A99B';
}
function markerSize(n){
  if(n>=7) return 22;
  if(n>=4) return 17;
  if(n>=2) return 13;
  return 9;
}

/* ================= 地图 ================= */
echarts.registerMap('china', window.CHINA_GEO);
/* canvas 渲染器 + useDirtyRect：roam 时整帧重绘成本更低，移动端双指缩放更跟手 */
const chart = echarts.init(document.getElementById('map'), null, { renderer:'canvas', useDirtyRect:true });

/* 只用 geo 组件画地图，不再用 scatter 系列。
   红点改为 DOM 覆盖层——每次 georoam 时用 convertToPixel 算出像素坐标，
   直接写入 DOM 元素的 left/top，从根本上保证红点永远钉在地图上。 */
chart.setOption({
  geo:{
    map:'china', roam:true, zoom:1.08,
    itemStyle:{ areaColor:'#F1E8D8', borderColor:'#E0D2B6', borderWidth:1 },
    emphasis:{ itemStyle:{ areaColor:'#EADCC4' }, label:{ show:false } },
    label:{ show:false },
    scaleLimit:{ min:0.8, max:12 }
  }
});

/* ---- 创建 DOM 红点 ---- */
const overlay = document.getElementById('dot-overlay');
overlay.classList.add('zooming'); // 初始加载阶段禁用过渡
const tooltipEl = document.getElementById('custom-tooltip');
	let tooltipSticky = false;
/* 触屏设备（手机/平板）点击红点时只显示信息，不自动滚动名单；电脑端保留原行为 */
const isTouchDevice = window.matchMedia('(hover: none)').matches;

const dotEls = CITIES.map(c => {
  const el = document.createElement('div');
  el.className = 'city-dot';
  el.dataset.idx = c.idx;
  const circle = document.createElement('div');
  circle.className = 'dot-circle';
  circle.style.width = circle.style.height = markerSize(c.count) + 'px';
  circle.style.background = ramp(c.count);
  const label = document.createElement('div');
  label.className = 'dot-label';
  label.textContent = c.city + ' ' + c.count;
  el.appendChild(circle);
  el.appendChild(label);
  overlay.appendChild(el);

  el.addEventListener('click', e => {
    e.stopPropagation();
	    tooltipSticky = true;
    showTooltip(c, el);
    if(!isTouchDevice) scrollToCity(c);
  });
  el.addEventListener('mouseenter', () => {
    el.classList.add('active');
    showTooltip(c, el);
  });
  el.addEventListener('mouseleave', () => {
    el.classList.remove('active');
    if(!tooltipSticky) hideTooltip();
  });
  return { el:el, circle:circle };
});

function showTooltip(c, anchorEl, px, py){
  let h = '<div style="font-size:14px;font-weight:700;color:#9E2B20;margin-bottom:6px;">' + c.city + ' · ' + c.count + '人</div>';
  c.schools.forEach(s => {
    h += '<div style="font-size:13px;margin-top:4px;"><b style="color:#4A3F33;">' + s[0] + '</b><div style="color:#7A6C5C;margin-top:1px;">' + s[1].join('、') + '</div></div>';
  });
  tooltipEl.innerHTML = h;
  tooltipEl.style.display = 'block';
  /* 以圆点或点击坐标为锚自动定位，不超出地图边界 */
  const box = document.getElementById('map-box').getBoundingClientRect();
  const ttH = tooltipEl.offsetHeight, ttW = tooltipEl.offsetWidth;
  let left, top;
  if(px != null && py != null){
    left = px - ttW / 2;
    top = py - ttH - 10;
  } else {
    const rect = anchorEl.getBoundingClientRect();
    left = rect.left - box.left + rect.width / 2 - ttW / 2;
    top = rect.top - box.top - ttH - 10;
  }
  if(top < 8) top = (px != null && py != null ? py : anchorEl.getBoundingClientRect().bottom - box.top) + 10; /* 上方放不下就放下方 */
  left = Math.max(8, Math.min(left, box.width - ttW - 8));
  top = Math.max(8, Math.min(top, box.height - ttH - 8));
  tooltipEl.style.left = left + 'px';
  tooltipEl.style.top = top + 'px';
}
function hideTooltip(){ tooltipEl.style.display = 'none'; }
document.getElementById('map-box').addEventListener('click', e => {
	  if(!e.target.closest('.city-dot') && !tooltipSticky) hideTooltip();
});

/* 手机端：省份地图块只有一个城市有同学时，点地图块直接弹出该城市信息 */
function normProvince(p){
  return String(p || '').replace(/(省|市|壮族自治区|回族自治区|维吾尔自治区|自治区|特别行政区)$/g, '');
}
chart.on('click', params => {
  if(!isTouchDevice) return;
  if(!params || params.componentType !== 'geo') return;
  const name = (params.name || (params.region && params.region.name) || '').trim();
  if(!name) return;
  const prov = normProvince(name);
  const hits = CITIES.filter(c => normProvince(c.province) === prov);
  if(hits.length === 1){
    const c = hits[0];
    tooltipSticky = true;
    const ev = params.event || {};
    showTooltip(c, dotEls[c.idx].el, ev.offsetX, ev.offsetY);
  }
});

function scrollToCity(c){
  const el = document.getElementById('city-' + c.idx);
  if(!el) return;
  el.scrollIntoView({ behavior:'smooth', block:'center' });
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

/* ---- 红点定位 + 缩放联动 ---- */
function getGeoZoom(){
  try{
    const g = chart.getModel().getComponent('geo').coordinateSystem;
    if(g && typeof g.getZoom === 'function'){
      const z = g.getZoom();
      if(typeof z === 'number' && isFinite(z)) return z;
    }
  }catch(e){ }
  return (chart.getOption().geo && chart.getOption().geo[0] && chart.getOption().geo[0].zoom) || 1;
}

const mapTip = document.getElementById('map-tip');
let _mapTipShown = false;
function updateDots(){
  const zoom = getGeoZoom();
  const w = chart.getWidth(), h = chart.getHeight();
  const showLabels = zoom >= 1.6;
  const scaleFactor = Math.min(zoom / 1.08, 2.2); /* 放大时红点适度变大，上限 2.2 倍 */

  CITIES.forEach((c, i) => {
    const p = chart.convertToPixel({ geoIndex:0 }, c.coords);
    const item = dotEls[i], el = item.el, circle = item.circle;
    if(p && isFinite(p[0]) && isFinite(p[1])){
      /* transform 定位走合成层，避免每帧改 left/top 触发布局 */
      el.style.transform = 'translate3d(' + p[0] + 'px,' + p[1] + 'px,0) translate(-50%,-50%)';
      const visible = p[0] > -60 && p[0] < w + 60 && p[1] > -60 && p[1] < h + 60;
      if(visible !== el._v){ el.style.display = visible ? '' : 'none'; el._v = visible; }
      const sz = Math.round(markerSize(c.count) * scaleFactor);
      if(sz !== circle._s){ circle.style.width = circle.style.height = sz + 'px'; circle._s = sz; }
      const showLabel = showLabels && visible;
      if(showLabel !== el._l){ el.classList.toggle('show-label', showLabel); el._l = showLabel; }
    } else if(el._v !== false){
      el.style.display = 'none';
      el._v = false;
    }
  });
  if(showLabels !== _mapTipShown){
    _mapTipShown = showLabels;
    mapTip.classList.toggle('hide', showLabels);
  }
}

/* RAF 节流：连续 georoam 时合并 DOM 更新到一个帧，避免双指缩放掉帧 */
let _updateDotsRAF = null;
function scheduleUpdateDots(){
  if(_updateDotsRAF) return;
  _updateDotsRAF = requestAnimationFrame(() => {
    _updateDotsRAF = null;
    updateDots();
  });
}
/* 地图每次 roam 时：收起提示框、解除 sticky 状态、节流刷新红点 */
let _lastZoomAt = 0, _zoomCheckRAF = null;
/* 缩放/拖拽开始时禁用过渡，最后一次 roam 后 250ms 再恢复，避免每帧重建定时器 */
function _markZooming(){
  _lastZoomAt = performance.now();
  overlay.classList.add('zooming');
  if(_zoomCheckRAF) return;
  (function tick(){
    if(performance.now() - _lastZoomAt > 250){
      overlay.classList.remove('zooming');
      _zoomCheckRAF = null;
      return;
    }
    _zoomCheckRAF = requestAnimationFrame(tick);
  })();
}
chart.on('georoam', () => { hideTooltip(); tooltipSticky = false; scheduleUpdateDots(); _markZooming(); });

/* 手机端拖拽/缩放时让红点不拦截手势（overlay.dragging → pointer-events:none） */
const mapBox = document.getElementById('map-box');
mapBox.addEventListener('touchstart', () => overlay.classList.add('dragging'), { passive:true });
mapBox.addEventListener('touchend', () => overlay.classList.remove('dragging'));
mapBox.addEventListener('touchcancel', () => overlay.classList.remove('dragging'));

window.addEventListener('resize', () => {
  chart.resize();
  hideTooltip();
  tooltipSticky = false;
  updateDots();
});

/* 名单点击 → 地图飞到对应城市 */
function flyToCity(c){
  const zoom = Math.max(getGeoZoom(), 2.5);
  chart.setOption({ geo:{ center: c.coords, zoom } }, { lazyUpdate:true });
  requestAnimationFrame(() => {
   updateDots();
   tooltipSticky = true;
   showTooltip(c, dotEls[c.idx].el);
 });
setTimeout(updateDots, 300);
setTimeout(updateDots, 800);
setTimeout(updateDots, 1500);
}

/* ================= 名单 ================= */
const listEl = document.getElementById('city-list');
CITIES.forEach(c => {
  const sec = document.createElement('section');
  sec.className = 'city';
  sec.id = 'city-' + c.idx;
  const head = document.createElement('div');
  head.className = 'city-head';
  head.innerHTML = '<span class="city-name">' + c.city + '</span><span class="city-province">' + c.province + '</span><span class="city-count">' + c.count + '人</span>';
  head.title = '在地图上定位';
  head.addEventListener('click', () => flyToCity(c));
  const schools = document.createElement('div');
  schools.className = 'schools';
  c.schools.forEach(s => {
    const row = document.createElement('div');
    row.className = 'school';
    row.innerHTML = '<span class="school-name">' + s[0] + '</span><span class="students">' + s[1].join('、') + '</span>';
    schools.appendChild(row);
  });
  sec.appendChild(head);
  sec.appendChild(schools);
  listEl.appendChild(sec);
});

/* setOption 改 center/zoom 不触发 georoam，但会触发 finished；
   注册一次即可覆盖后续所有动画（包括用户拖拽后的收尾） */
chart.on('finished', updateDots);
updateDots();
/* 初始渲染完成，移除 zoom 状态 */
setTimeout(() => overlay.classList.remove('zooming'), 500);

/* ================= 查看全屏地图 ================= */
const fullscreenBtn = document.getElementById('fullscreen-btn');
const fullscreenLayer = document.getElementById('map-fullscreen');
const fullscreenImage = fullscreenLayer.querySelector('img');

function closeFullscreenLayer(){ fullscreenLayer.hidden = true; }

function closeFullscreenMap(){
  if(document.fullscreenElement === fullscreenLayer){
    const exit = document.exitFullscreen || document.webkitExitFullscreen;
    if(exit) exit.call(document).catch(closeFullscreenLayer);
  } else {
    closeFullscreenLayer();
  }
}

fullscreenBtn.addEventListener('click', () => {
  fullscreenLayer.hidden = false;
  const enter = fullscreenLayer.requestFullscreen || fullscreenLayer.webkitRequestFullscreen;
  if(enter) Promise.resolve(enter.call(fullscreenLayer)).catch(() => {});
});

document.getElementById('map-fullscreen-close').addEventListener('click', closeFullscreenMap);

fullscreenLayer.addEventListener('click', e => {
  if(e.target === fullscreenLayer || e.target === fullscreenImage) closeFullscreenMap();
});

document.addEventListener('fullscreenchange', () => {
  if(!document.fullscreenElement) closeFullscreenLayer();
});
document.addEventListener('webkitfullscreenchange', () => {
  if(!document.webkitFullscreenElement) closeFullscreenLayer();
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !fullscreenLayer.hidden) closeFullscreenMap();
});
</script>
